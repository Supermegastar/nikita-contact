<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#48474d">
<meta name="description" content="Никита Старков — ООО МГК Световые Технологии">
<title>Никита Старков</title>

<style>
:root{
  --bg:#48474d;
  --white:#fff;
  --muted:#c5c4c8;
  --purple:#9d4cb5;
  --link:#e582ed;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial, Helvetica, sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
a{color:inherit;text-decoration:none}

.card{
  width:min(100%,896px);
  min-height:100svh;
  margin:0 auto;
  padding:34px 28px 54px;
  background:var(--bg);
  text-align:center;
  overflow-x:hidden;
}

/* Full LT logo — deliberately smaller than v4 so it can never crop on mobile */
.logo{
  display:block;
  width:min(68vw, 560px);
  max-width:100%;
  height:auto;
  margin:0 auto 28px;
}

/* Photo */
.avatar{
  display:block;
  width:min(40.5vw, 235px);
  aspect-ratio:1;
  margin:0 auto 37px;
  border-radius:50%;
  object-fit:cover;
  object-position:center 24%;
  background:#fff;
}

/* Main info */
.company{
  margin:0 auto 19px;
  white-space:nowrap;
  font-size:clamp(17px, 4.35vw, 24px);
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.25px;
}

.name{
  margin:0;
  font-size:clamp(29px, 7.4vw, 42px);
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.45px;
}

.role{
  margin:20px auto 0;
  max-width:360px;
  color:var(--muted);
  font-size:clamp(18px, 4.65vw, 26px);
  line-height:1.38;
  font-weight:400;
}

/* Contacts — tightened to match colleague card proportions */
.contacts{
  margin-top:43px;
}
.phone{
  display:block;
  margin-bottom:18px;
  font-size:clamp(21px, 5.4vw, 31px);
  line-height:1.2;
}
.address{
  max-width:390px;
  margin:0 auto 13px;
  font-size:clamp(18px, 4.65vw, 27px);
  line-height:1.38;
}
.link{
  display:block;
  margin-top:10px;
  color:var(--link);
  font-size:clamp(18px, 4.8vw, 28px);
  line-height:1.3;
}

/* CTA */
.cta{
  width:100%;
  min-height:69px;
  margin:46px auto 0;
  padding:14px 18px;
  border-radius:12px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:clamp(20px, 5.2vw, 29px);
  line-height:1.1;
  font-weight:400;
}
.person{
  width:29px;
  height:27px;
  position:relative;
  flex:0 0 auto;
}
.person:before{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  left:1px;
  top:0;
  border-radius:50%;
  background:#fff;
}
.person:after{
  content:"";
  position:absolute;
  width:23px;
  height:12px;
  left:-3px;
  bottom:0;
  border-radius:12px 12px 3px 3px;
  background:#fff;
}
.plus{
  position:absolute;
  right:-3px;
  top:-5px;
  color:#fff;
  font-size:21px;
  line-height:1;
  font-weight:700;
}

/* Desktop/tablet */
@media (min-width:601px){
  .card{padding:52px 70px 78px}
  .logo{width:560px;margin-bottom:40px}
  .avatar{width:330px;margin-bottom:55px}
  .company{font-size:38px;margin-bottom:24px}
  .name{font-size:48px}
  .role{font-size:32px;max-width:700px;margin-top:25px}
  .contacts{margin-top:48px}
  .phone{font-size:33px;margin-bottom:20px}
  .address{font-size:30px;max-width:800px}
  .link{font-size:30px}
  .cta{min-height:102px;margin-top:64px;border-radius:18px;font-size:33px}
}
</style>
</head>

<body>
<main class="card">

  <img class="logo" src="lt-logo.png" alt="Световые Технологии">

  <img class="avatar"
       src="https://upload.wikimedia.org/wikipedia/commons/f/f0/Brad_Pitt_2008.jpg"
       alt="Никита Старков">

  <div class="company">ООО "МГК "Световые Технологии"</div>

  <h1 class="name">Никита Старков</h1>

  <div class="role">Руководитель направления «Спорт»</div>

  <div class="contacts">
    <a class="phone" href="tel:+79296817127">+79296817127</a>

    <div class="address">
      127273, г. Москва, ул. Отрадная, д.2Б, стр.7
    </div>

    <a class="link" href="https://www.ltcompany.com/" target="_blank" rel="noopener">
      www.ltcompany.com
    </a>

    <a class="link" href="mailto:n.starkov@ltcompany.com">
      n.starkov@ltcompany.com
    </a>
  </div>

  <a class="cta" href="contact.vcf" download>
    <span class="person"><span class="plus">+</span></span>
    <span>Добавить в контакты</span>
  </a>

</main>
</body>
</html>
