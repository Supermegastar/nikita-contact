<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#47464b">
<meta name="description" content="Никита Старков — ООО МГК Световые Технологии">
<title>Никита Старков</title>
<style>
:root{
  --bg:#48474d;
  --white:#fff;
  --muted:#c5c4c8;
  --purple:#9d4cb5;
  --link:#e582ed;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--white);
  font-family:Arial, Helvetica, sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}
a{color:inherit;text-decoration:none}

.card{
  width:min(100%,1080px);
  min-height:100svh;
  margin:0 auto;
  background:var(--bg);
  text-align:center;
  padding:74px 82px 105px;
}

/* LOGO */
.logo{
  display:block;
  width:690px;
  max-width:76vw;
  height:auto;
  margin:0 auto 42px;
}

/* PHOTO */
.avatar{
  width:330px;
  height:330px;
  max-width:43vw;
  max-height:43vw;
  display:block;
  margin:0 auto 66px;
  border-radius:50%;
  object-fit:cover;
  object-position:center 24%;
  background:#fff;
}

/* TEXT */
.company{
  margin:0 0 26px;
  font-size:40px;
  line-height:1.16;
  font-weight:700;
  letter-spacing:-.7px;
}

.name{
  margin:0;
  font-size:48px;
  line-height:1.12;
  font-weight:700;
  letter-spacing:-.8px;
}

.role{
  max-width:760px;
  min-height:98px;
  margin:27px auto 0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  color:var(--muted);
  font-size:34px;
  line-height:1.45;
  font-weight:400;
}

/* CONTACTS */
.contacts{
  margin-top:42px;
}
.phone{
  display:block;
  font-size:34px;
  line-height:1.25;
  margin-bottom:22px;
}
.address{
  max-width:850px;
  margin:0 auto 18px;
  font-size:31px;
  line-height:1.36;
}
.link{
  display:block;
  color:var(--link);
  font-size:31px;
  line-height:1.32;
  margin-top:13px;
}

/* BUTTON */
.cta{
  width:100%;
  min-height:106px;
  margin:76px auto 0;
  padding:18px 32px;
  border-radius:18px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  font-size:34px;
  line-height:1.1;
  font-weight:400;
}

.person{
  width:33px;
  height:30px;
  position:relative;
  flex:0 0 auto;
}
.person:before{
  content:"";
  position:absolute;
  width:15px;
  height:15px;
  left:1px;
  top:0;
  border-radius:50%;
  background:#fff;
}
.person:after{
  content:"";
  position:absolute;
  width:25px;
  height:13px;
  left:-4px;
  bottom:0;
  border-radius:13px 13px 3px 3px;
  background:#fff;
}
.plus{
  position:absolute;
  right:-3px;
  top:-5px;
  color:#fff;
  font-size:23px;
  line-height:1;
  font-weight:700;
}

/* Match the colleague's card proportions on phones */
@media (max-width:600px){
  .card{
    padding:37px 28px 58px;
  }
  .logo{
    width:75vw;
    max-width:610px;
    margin-bottom:31px;
  }
  .avatar{
    width:40.5vw;
    height:40.5vw;
    max-width:235px;
    max-height:235px;
    margin-bottom:41px;
  }
  .company{
    margin-bottom:22px;
    font-size:23px;
    line-height:1.17;
    letter-spacing:-.25px;
  }
  .name{
    font-size:32px;
    line-height:1.13;
    letter-spacing:-.35px;
  }
  .role{
    min-height:65px;
    max-width:350px;
    margin-top:22px;
    font-size:20px;
    line-height:1.46;
  }
  .contacts{
    margin-top:31px;
  }
  .phone{
    font-size:23px;
    margin-bottom:17px;
  }
  .address{
    max-width:370px;
    margin-bottom:13px;
    font-size:20px;
    line-height:1.42;
  }
  .link{
    margin-top:10px;
    font-size:20px;
  }
  .cta{
    min-height:70px;
    margin-top:50px;
    border-radius:12px;
    gap:13px;
    padding:14px 20px;
    font-size:22px;
  }
  .person{transform:scale(.83)}
}

@media (max-width:390px){
  .card{padding-left:21px;padding-right:21px}
  .company{font-size:21px}
  .name{font-size:30px}
  .role{font-size:19px}
  .phone{font-size:21px}
  .address,.link{font-size:18px}
  .cta{font-size:20px}
}
</style>
</head>
<body>
<main class="card">

  <img class="logo" src="lt-logo.png" alt="Световые Технологии">

  <img class="avatar"
       src="https://upload.wikimedia.org/wikipedia/commons/f/f0/Brad_Pitt_2008.jpg"
       alt="Никита Старков">

  <div class="company">ООО "МГК "Световые Технологии"</div>

  <h1 class="name">Никита Старков</h1>

  <div class="role">Руководитель направления «Спорт»</div>

  <div class="contacts">
    <a class="phone" href="tel:+79296817127">+79296817127</a>

    <div class="address">
      127273, г. Москва, ул. Отрадная, д.2Б, стр.7
    </div>

    <a class="link" href="https://www.ltcompany.com/" target="_blank" rel="noopener">
      www.ltcompany.com
    </a>

    <a class="link" href="mailto:n.starkov@ltcompany.com">
      n.starkov@ltcompany.com
    </a>
  </div>

  <a class="cta" href="contact.vcf" download>
    <span class="person"><span class="plus">+</span></span>
    <span>Добавить в контакты</span>
  </a>

</main>
</body>
</html>
